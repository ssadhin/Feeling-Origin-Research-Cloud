name: O001-S1 Nonlinear Sensitivity Once

on:
  push:
    paths:
      - "triggers/o001_s1_nonlinear_v001.txt"

permissions:
  contents: read

concurrency:
  group: o001-s1-nonlinear-v001
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run frozen nonlinear sensitivity
        run: python analysis/o001_s1_nonlinear_sensitivity.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o001-s1-nonlinear-${{ github.run_id }}
          path: results/o001_s1_nonlinear_sensitivity.json
          if-no-files-found: error
          retention-days: 14
