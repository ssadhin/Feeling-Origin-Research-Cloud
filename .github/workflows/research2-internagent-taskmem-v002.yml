name: Research2 InternAgent original task memory native v002
on:
  push:
    branches: [research2-qualification-cloud-20261011]
    paths:
      - .github/workflows/research2-internagent-taskmem-v002.yml
permissions:
  contents: read
jobs:
  original-internagent-taskmem-corrected-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original memory retrieval/guidance with corrected original display assertions
        run: bash research2/qualification/run_internagent_taskmem_native_v002.sh
      - name: Preserve prior failures separately and store new source-native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research2-q1-internagent-native-taskmem-v002
          path: research2/qualification/output-internagent-taskmem-v002/
          retention-days: 14
          if-no-files-found: warn
