name: O002-H1 Prior Lag Depth Once

on:
  push:
    paths:
      - "triggers/o002_h1_prior_lag_depth_v001.txt"

permissions:
  contents: read

concurrency:
  group: o002-h1-prior-lag-depth-v001
  cancel-in-progress: true

jobs:
  lagdepth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run frozen lag-depth robustness
        run: python analysis/o002_h1_prior_lag_depth.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o002-h1-prior-lag-depth-${{ github.run_id }}
          path: results/o002_h1_prior_lag_depth.json
          if-no-files-found: error
          retention-days: 14
