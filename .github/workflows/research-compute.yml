name: Research Compute

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload to run
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - core
          - ablation
          - organism_v014
          - proxy_mediation_gate
          - proxy_mediation_sensitivity
          - theory_audit_v001
      trials:
        description: Ablation parameter sets (used only for ablation)
        required: false
        default: "2500"
      organism_dev:
        description: Development worlds for organism_v014
        required: false
        default: "40"
      organism_test:
        description: Held-out worlds for organism_v014
        required: false
        default: "120"
      organism_tune:
        description: Rival tuning candidates for organism_v014
        required: false
        default: "30"
      organism_test_start:
        description: First held-out seed for organism_v014
        required: false
        default: "50000"
      proxy_bootstrap:
        description: Subject-cluster bootstrap replicates for proxy mediation workloads
        required: false
        default: "1000"

concurrency:
  group: research-compute
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Runner info
        run: |
          echo "CPU"
          lscpu
          echo "MEMORY"
          free -h
          echo "DISK"
          df -h .

      - name: Run smoke
        if: ${{ inputs.workload == 'smoke' }}
        run: python cloud/smoke.py

      - name: Run CRFI core suite
        if: ${{ inputs.workload == 'core' }}
        run: python cloud/run_core.py

      - name: Run CRFI ablation
        if: ${{ inputs.workload == 'ablation' }}
        run: python cloud/run_ablation.py --trials "${{ inputs.trials }}"

      - name: Run virtual organism v014
        if: ${{ inputs.workload == 'organism_v014' }}
        run: >-
          python cloud/run_organism.py
          --dev "${{ inputs.organism_dev }}"
          --test "${{ inputs.organism_test }}"
          --tune "${{ inputs.organism_tune }}"
          --test-start "${{ inputs.organism_test_start }}"

      - name: Run human proxy-source mediation gate
        if: ${{ inputs.workload == 'proxy_mediation_gate' }}
        run: >-
          python analysis/human_proxy_mediation_gate.py
          --bootstrap "${{ inputs.proxy_bootstrap }}"

      - name: Run cardiac mediator sensitivity
        if: ${{ inputs.workload == 'proxy_mediation_sensitivity' }}
        run: >-
          python analysis/human_proxy_mediation_sensitivity.py
          --bootstrap "${{ inputs.proxy_bootstrap }}"

      - name: Run theory discrimination audit v001
        if: ${{ inputs.workload == 'theory_audit_v001' }}
        run: python analysis/theory_discrimination_audit_v001.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
