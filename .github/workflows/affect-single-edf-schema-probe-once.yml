name: Affect Single EDF Schema Probe Once

on:
  push:
    paths:
      - "triggers/affect_single_edf_schema_probe_v001.txt"

permissions:
  contents: read

concurrency:
  group: affect-single-edf-schema-probe-v001
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install schema dependency
        run: python -m pip install numpy "pyedflib>=0.1.38,<1"
      - name: Probe one EDF
        run: python analysis/affect_multimodal_single_edf_schema_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: affect-single-edf-schema-probe-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
