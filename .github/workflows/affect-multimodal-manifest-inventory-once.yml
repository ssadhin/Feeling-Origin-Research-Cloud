name: Affect Multimodal Manifest Inventory Once

on:
  push:
    paths:
      - "triggers/affect_multimodal_manifest_inventory_v001.txt"

permissions:
  contents: read

concurrency:
  group: affect-multimodal-manifest-inventory-v001
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run manifest inventory
        run: python analysis/affect_multimodal_manifest_inventory.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affect-multimodal-manifest-inventory-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
