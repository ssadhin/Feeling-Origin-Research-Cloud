name: Affect Multimodal Alignment Probe Once

on:
  push:
    paths:
      - "triggers/affect_multimodal_alignment_probe_v001.txt"

permissions:
  contents: read

concurrency:
  group: affect-multimodal-alignment-probe-v001
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe multimodal alignment
        run: python analysis/affect_multimodal_alignment_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: affect-multimodal-alignment-probe-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
