name: O001 Extraction Smoke Once

on:
  push:
    paths:
      - "triggers/o001_extraction_smoke_v001.txt"

permissions:
  contents: read

concurrency:
  group: o001-extraction-smoke-v001
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.14,<2" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run extraction-only smoke
        run: python analysis/observational_multimodal_redundancy_o001.py --max-subjects 2 --extract-only
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o001-extraction-smoke-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
