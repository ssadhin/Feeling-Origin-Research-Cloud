name: Research2 InternAgent original Generation Evolution memory causal v003
on:
  push:
    branches: [research2-qualification-cloud-20261011]
    paths:
      - .github/workflows/research2-internagent-generation-memory-v003.yml
permissions:
  contents: read
jobs:
  original-multiagent-memory-policy-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native generation/evolution policy checks with memory enabled and original disabled ablation
        run: bash research2/qualification/run_internagent_taskmem_native_v003.sh
      - name: Persist original Python imports, real retrieval, source-fidelity negative controls and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research2-q1-internagent-generation-evolution-native-v003
          path: research2/qualification/output-internagent-taskmem-v003/
          retention-days: 14
          if-no-files-found: warn
