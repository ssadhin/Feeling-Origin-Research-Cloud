name: O001-E1 Schema QC Once

on:
  push:
    paths:
      - "triggers/o001_e1_schema_qc_v001.txt"

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "numpy>=2,<3" "scipy>=1.14,<2"
      - name: Probe
        run: python analysis/o001_e1_schema_qc.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o001-e1-schema-qc-${{ github.run_id }}
          path: results/o001_e1_schema_qc.json
          if-no-files-found: error
          retention-days: 14
