name: O002 CASE External Replication Once

on:
  push:
    paths:
      - "triggers/o002_case_full_v001.txt"

permissions:
  contents: read

concurrency:
  group: o002-case-full-v001
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.14,<2" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run frozen O002
        run: python analysis/case_external_replication_o002.py --bootstrap 5000
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o002-case-full-${{ github.run_id }}
          path: |
            results/case_external_replication_o002.json
            results/o002_feature_rows.jsonl
          if-no-files-found: error
          retention-days: 14
