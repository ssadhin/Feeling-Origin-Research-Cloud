name: DENS Pilot Inventory Once

on:
  push:
    paths:
      - "triggers/dens_pilot_inventory_v001.txt"

permissions:
  contents: read

concurrency:
  group: dens-pilot-inventory-v001
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pilot dependencies
        run: python -m pip install "mne>=1.9,<2" "numpy>=2,<3" "scipy>=1.14,<2"
      - name: Run DENS pilot inventory
        run: python analysis/dens_pilot_inventory.py
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dens-pilot-inventory-${{ github.run_id }}
          path: results/dens_pilot_inventory.json
          if-no-files-found: error
          retention-days: 14
