name: DENS Signal QC Once

on:
  push:
    paths:
      - "triggers/dens_signal_qc_v001.txt"

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "mne>=1.9,<2" "numpy>=2,<3" "scipy>=1.14,<2" "neurokit2>=0.2.12,<0.3"
      - name: Run label-blind QC
        run: python analysis/dens_signal_qc.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dens-signal-qc-${{ github.run_id }}
          path: results/dens_signal_qc.json
          if-no-files-found: error
          retention-days: 14
