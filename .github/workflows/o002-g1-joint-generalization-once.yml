name: O002-G1 Joint Generalization Once

on:
  push:
    paths:
      - "triggers/o002_g1_joint_person_stimulus_v001.txt"

permissions:
  contents: read

concurrency:
  group: o002-g1-joint-generalization-v001
  cancel-in-progress: true

jobs:
  generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run frozen joint person-stimulus generalization
        run: python analysis/o002_g1_joint_person_stimulus_generalization.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o002-g1-joint-generalization-${{ github.run_id }}
          path: results/o002_g1_joint_person_stimulus_generalization.json
          if-no-files-found: error
          retention-days: 14
