name: O002-D2 CASE Metric Trajectory Sensitivity Once

on:
  push:
    paths:
      - "triggers/o002_d2_metric_trajectory_v001.txt"

permissions:
  contents: read

concurrency:
  group: o002-d2-metric-trajectory-v001
  cancel-in-progress: true

jobs:
  metric-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "pandas>=2.2,<3" "scikit-learn>=1.6,<2"
      - name: Run frozen CASE metric and trajectory sensitivity
        run: python analysis/o002_d2_metric_trajectory_sensitivity.py
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o002-d2-metric-trajectory-${{ github.run_id }}
          path: results/o002_d2_metric_trajectory_sensitivity.json
          if-no-files-found: error
          retention-days: 14
