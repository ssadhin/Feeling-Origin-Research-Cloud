name: O002-G2 Horizon Stress Once

on:
  push:
    paths:
      - "triggers/o002_g2_horizon_stress_v001.txt"

permissions:
  contents: read

concurrency:
  group: o002-g2-horizon-stress-v001
  cancel-in-progress: true

jobs:
  horizon-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.6,<2" "pandas>=2.2,<3"
      - name: Run frozen O002-G2 prospective horizon stress
        run: python analysis/o002_g2_horizon_stress.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: o002-g2-horizon-stress-${{ github.run_id }}
          path: results/o002_g2_horizon_stress.json
          if-no-files-found: error
          retention-days: 14
